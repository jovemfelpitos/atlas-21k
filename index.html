<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a23"><title>Atlas 21K</title><meta name="description" content="Plano de corrida e diário de treinos do Projeto Atlas 21K."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111a23'/%3E%3Cpath d='M7 24 16 7 25 24M11 18h10' fill='none' stroke='%23ceff63' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header><a href="#" class="brand">ATLAS <span>21K</span></a><button id="account" class="subtle">Entrar</button></header>
<main><section class="intro"><div><p class="eyebrow">08 OUT — 15 NOV 2026</p><h1>Um treino<br>de cada vez.</h1></div><div class="goal"><strong>21,1</strong><span>km · meta 2h30</span></div></section>
<div id="notice" role="status" class="notice">Carregando…</div>
<nav aria-label="Seções"><button data-view="today" class="active">Treino</button><button data-view="calendar">Calendário</button><button data-view="progress">Evolução</button><button data-view="guide">Guia</button></nav>
<section id="content"></section>
<footer>Meta provisória. Esforço e recuperação decidem a progressão.</footer></main>
<dialog id="recordDialog"><form id="recordForm"><div class="dialog-head"><h2 id="recordTitle">Registrar treino</h2><button type="button" data-close="recordDialog" aria-label="Fechar">✕</button></div><input name="date" type="hidden"><label>Status<select name="status"><option value="feito">Feito</option><option value="adaptado">Adaptado</option><option value="não feito">Não feito</option></select></label><div class="form-grid"><label>Distância (km)<input name="km" type="number" min="0" max="100" step="0.01" inputmode="decimal"></label><label>Tempo (min)<input name="minutes" type="number" min="0.01" max="1440" step="0.01" inputmode="decimal"></label><label>Esforço (0–10)<input name="effort" type="number" min="0" max="10" step="1" inputmode="numeric"></label><label>Dor (0–10)<input name="pain" type="number" min="0" max="10" step="1" inputmode="numeric"></label></div><label>Recuperação no dia seguinte<select name="recovery"><option value="">Ainda não avaliei</option><option>Normal</option><option>Pernas pesadas</option><option>Dor persistente</option></select></label><label>Como foi?<textarea name="notes" rows="3" maxlength="3000" placeholder="Pausas, ladeiras, sono, dores e dúvidas…"></textarea></label><p id="saveError" class="error" role="alert"></p><button type="submit" class="primary">Salvar treino</button></form></dialog>
<dialog id="authDialog"><form id="authForm"><div class="dialog-head"><h2>Acessar meus treinos</h2><button type="button" data-close="authDialog" aria-label="Fechar">✕</button></div><p>Use a mesma conta no celular e computador.</p><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><p id="authError" role="status"></p><button class="primary" type="submit">Entrar</button><button id="signup" type="button" class="secondary">Criar conta</button></form></dialog>
<script src="config.js"></script><script src="plan.js"></script><script type="module" src="app.js"></script></body></html>
