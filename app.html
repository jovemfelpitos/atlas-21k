<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a23"><meta name="robots" content="noindex"><title>Meu app · Atlas Run</title><meta name="description" content="Seus planos de corrida e diário de atividades."><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/management.css"><link rel="stylesheet" href="/profile.css"></head><body>
<header><a href="/" class="brand">ATLAS <span>RUN</span></a><div><button id="sync" hidden aria-label="Atualizar dados">↻</button><button id="account">Entrar</button></div></header>
<main id="appMain" hidden><section class="intro"><div><p class="eyebrow">CORRIDA · ROTINA · EVOLUÇÃO</p><h1>Um treino<br>de cada vez.</h1></div></section><p id="goal" class="status"></p><div id="notice" role="status" class="notice"></div><select id="planSelect" aria-label="Selecionar plano" hidden></select>
<div id="accountIdentity" class="account-identity" hidden><div class="account-avatar"><span id="accountInitials"></span><img id="accountAvatar" alt="Sua foto de perfil" hidden></div><div><strong id="accountName"></strong><small id="accountArea"></small></div></div><label id="areaSwitcher" class="area-switcher" hidden>Trocar área<select id="areaSelect" aria-label="Área da conta"></select></label><nav aria-label="Seções"><button data-view="today">Treino</button><button data-view="calendar">Calendário</button><button data-view="progress">Evolução</button><button data-view="guide">Guia</button><button data-view="profile">Perfil</button></nav><section id="content"></section><footer>Atlas Run · Um treino de cada vez.</footer></main>
<dialog id="recordDialog"><form id="recordForm"><div class="dialog-head"><h2 id="recordTitle">Registrar atividade</h2><button type="button" data-close="recordDialog" aria-label="Fechar">✕</button></div><input name="session_id" type="hidden"><label>Status<select name="status"><option>feito</option><option>adaptado</option><option>não feito</option></select></label><div class="form-grid"><label>Distância real (km)<input name="km" type="number" min="0" max="1000" step="0.01" inputmode="decimal"></label><label>Tempo real (min)<input name="minutes" type="number" min="0" max="1440" step="0.01" inputmode="decimal"></label><label>Esforço (0–10)<input name="effort" type="number" min="0" max="10" step="1" inputmode="numeric"></label><label>Dor (0–10)<input name="pain" type="number" min="0" max="10" step="1" inputmode="numeric"></label></div><label>Recuperação<select name="recovery"><option value="">Ainda não avaliei</option><option>Normal</option><option>Pernas pesadas</option><option>Dor persistente</option></select></label><label>Observações<textarea name="notes" rows="3" maxlength="3000"></textarea></label><p class="muted">Seu relato pode ser consultado pelo admin dono e pelos treinadores vinculados a você. Somente você pode editar este registro.</p><p id="saveError" class="error" role="alert"></p><button type="submit" class="primary">Salvar atividade</button></form></dialog>
<script src="/config.js"></script><script src="/legacy-plan.js"></script><script src="/legacy-guide.js"></script><script type="module" src="/app.js"></script></body></html>
